name: Scrape casino terms

on:
  workflow_dispatch:
    inputs:
      limit_per_source:
        description: "Rows per source CSV (0 = all). Use ~10 for a pilot."
        default: "0"
      shards:
        description: "Parallel jobs. A job stops starting casinos after 320 minutes; continue with previous_run_id."
        default: "14"
      concurrency:
        description: "Browser sessions per job. shards x concurrency must stay under the Browserless plan's concurrent-session limit (Starter: 30)."
        default: "2"
      only_ids:
        description: "Optional: comma-separated job ids to (re)run, e.g. casinoguru-00017,lcb-00002"
        default: ""
      previous_run_id:
        description: "Optional: a previous run's id; casinos already in its results are skipped (continue a run that hit the 6-hour limit)"
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: echo "shards=$(node -e 'console.log(JSON.stringify([...Array(Number(process.argv[1])).keys()]))' "${{ inputs.shards }}")" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/jobs.mjs --limit-per-source "${{ inputs.limit_per_source }}"
      - name: Fetch the previous run's results to skip what it already did
        if: inputs.previous_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.previous_run_id }}" -n results -D out/ && ls -la out/results.csv
      - name: Scrape shard ${{ matrix.shard }}
        env:
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_SECRET }}
          BROWSERLESS_REGION: ${{ vars.BROWSERLESS_REGION || 'production-sfo' }}
          EXIT_COUNTRIES: ${{ vars.EXIT_COUNTRIES || 'ca,de,nz,fi,ie,br,jp,in' }}
        run: |
          IDS=""; [ -n "${{ inputs.only_ids }}" ] && IDS="--ids ${{ inputs.only_ids }}"
          node src/scrape.mjs --shard "${{ matrix.shard }}" --shards "${{ inputs.shards }}" --concurrency "${{ inputs.concurrency }}" --deadline-minutes 320 $IDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            out/results/shard-${{ matrix.shard }}.csv
            out/text/
          retention-days: 14
          if-no-files-found: ignore

  merge:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Carry forward the previous run's results
        if: inputs.previous_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p shards/previous && gh run download "${{ inputs.previous_run_id }}" -n results -D shards/previous && mv shards/previous/results.csv shards/previous/shard-previous.csv
      - run: node src/merge.mjs shards
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            out/results.csv
            out/results-by-row.csv
          retention-days: 90
