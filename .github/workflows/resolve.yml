name: Resolve tracking links

# Plain-HTTP redirect following, no Browserless. casino.guru blocks an IP after a few hundred requests, so the links
# are spread over many runners, each with its own IP, and each shard stops when the tracker starts refusing it.
# Re-run to pick up whatever was left; input/resolved.json carries everything settled so far.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel runners (each gets a fresh IP; keep each shard under ~300 links)."
        default: "20"
      concurrency:
        description: "Requests in flight per runner."
        default: "2"
      delay_ms:
        description: "Pause after each link, per worker."
        default: "500"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: echo "shards=$(node -e 'console.log(JSON.stringify([...Array(Number(process.argv[1])).keys()]))' "${{ inputs.shards }}")" >> "$GITHUB_OUTPUT"

  resolve:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve shard ${{ matrix.shard }}
        run: node src/resolve.mjs --shard "${{ matrix.shard }}/${{ inputs.shards }}" --concurrency "${{ inputs.concurrency }}" --delay-ms "${{ inputs.delay_ms }}" --out "out/resolved-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-${{ matrix.shard }}
          path: out/resolved-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: ignore

  merge:
    needs: resolve
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - run: node src/resolve.mjs --merge shards
      - uses: actions/upload-artifact@v4
        with:
          name: resolved
          path: out/resolved.json
          retention-days: 90
